[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotbox"
version = "0.1.0.dev1"
description = "Persistent cooperative DOSBox-X play sessions for Dot"
requires-python = ">=3.12"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
connector = ["mcp==2.3.0"]

[project.scripts]
dotbox = "dotbox.cli:main"
dotbox-ownership-connector = "dotbox.connector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
